<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeQR WebRTC Audio Bridge</title>
</head>
<body style="background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px;">
  <div id="status" style="font-size: 11px; color: #10B981;">SafeQR Voice Engine Active</div>
  <audio id="remoteAudio" autoplay playsinline></audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const callId = urlParams.get('callId');
    const role = urlParams.get('role') || 'app';

    let pc = null;
    let localStream = null;
    let ws = null;
    let isMuted = false;
    let isSpeaker = true;
    let audioCtx = null;
    let gainNode = null;

    const remoteAudio = document.getElementById('remoteAudio');
    const statusEl = document.getElementById('status');

    function log(msg) {
      if (statusEl) statusEl.innerText = msg;
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'LOG', message: msg }));
      }
    }

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    };

    async function initAudioEngine() {
      log('Requesting microphone access...');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        log('Microphone active. Connecting signaling...');
      } catch (err) {
        log('Microphone error: ' + err.message);
      }

      const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProto}//${window.location.host}/ws/call?callId=${callId}&role=${role}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log('Signaling connected. Setting up WebRTC...');
        setupPeer();
      };

      ws.onmessage = async (event) => {
        try {
          if (typeof event.data === 'string') {
            const msg = JSON.parse(event.data);
            if (msg.type === 'OFFER') {
              log('Received offer, sending answer...');
              await handleOffer(msg.sdp);
            } else if (msg.type === 'ANSWER') {
              log('Received answer, connecting voice...');
              await handleAnswer(msg.sdp);
            } else if (msg.type === 'CANDIDATE' && pc && msg.candidate) {
              await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
            } else if (msg.type === 'CALL_ENDED') {
              stopCall();
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      ws.onerror = (e) => log('Signaling error: ' + (e.message || 'connection failed'));
    }

    function setupPeer() {
      pc = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          pc.addTrack(track, localStream);
        });
      }

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'CANDIDATE', candidate: event.candidate }));
        }
      };

      pc.ontrack = (event) => {
        log('Voice stream received. Playing through speaker...');
        if (remoteAudio && event.streams && event.streams[0]) {
          remoteAudio.srcObject = event.streams[0];
          setupAudioGain(event.streams[0]);
          remoteAudio.play().then(() => {
            log('2-Way voice connected and playing.');
          }).catch(err => {
            log('Autoplay audio: ' + err.message);
          });
        }
      };

      pc.onconnectionstatechange = () => {
        log('WebRTC State: ' + pc.connectionState);
      };

      if (role === 'web') {
        createOffer();
      }
    }

    function setupAudioGain(stream) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(stream);
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.8; // Loudspeaker amplification for clear audible voice
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      } catch (e) {
        console.log('AudioContext gain error:', e);
      }
    }

    async function createOffer() {
      if (!pc) return;
      const offer = await pc.createOffer({ offerToReceiveAudio: true });
      await pc.setLocalDescription(offer);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'OFFER', sdp: pc.localDescription }));
      }
    }

    async function handleOffer(sdp) {
      if (!pc) setupPeer();
      await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'ANSWER', sdp: pc.localDescription }));
      }
    }

    async function handleAnswer(sdp) {
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
      }
    }

    window.toggleMicMute = function(forceMute) {
      isMuted = typeof forceMute === 'boolean' ? forceMute : !isMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          track.enabled = !isMuted;
        });
      }
      log(isMuted ? 'Mic Muted' : 'Mic Live');
      return isMuted;
    };

    window.toggleSpeaker = function(enable) {
      isSpeaker = typeof enable === 'boolean' ? enable : !isSpeaker;
      if (gainNode) {
        gainNode.gain.value = isSpeaker ? 1.8 : 0.5;
      }
      if (remoteAudio) {
        remoteAudio.volume = isSpeaker ? 1.0 : 0.3;
      }
      log(isSpeaker ? 'Loudspeaker Mode (100%)' : 'Earpiece Mode (Low)');
      return isSpeaker;
    };

    window.stopCall = function() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      if (audioCtx) {
        try { audioCtx.close(); } catch {}
        audioCtx = null;
      }
      log('Call Stopped');
    };

    if (callId) {
      initAudioEngine();
    }
  </script>
</body>
</html>
